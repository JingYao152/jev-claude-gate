[project]
name = "jev-claude-gate"
version = "0.1.0"
description = "A fast System-1 security guardrail and gate for Claude Code powered by TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JingYao152" }]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # Line length (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
